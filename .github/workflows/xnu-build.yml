
name: Build XNU ARM64 baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xnu:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout J7 Prime project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install jq gum cmake ninja
          xcodebuild -version
          clang --version

      - name: Fetch XNU build system
        run: |
          git clone --depth 1 \
            https://github.com/blacktop/darwin-xnu-build.git \
            ../darwin-xnu-build

      - name: Compile ARM64 XNU
        working-directory: ../darwin-xnu-build
        env:
          ARCH_CONFIG: ARM64
          MACHINE_CONFIG: VMAPPLE
          KERNEL_CONFIG: DEVELOPMENT
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee xnu-build.log

      - name: Upload build output and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-arm64-baseline
          path: |
            ../darwin-xnu-build/build/**
            ../darwin-xnu-build/xnu-build.log
          if-no-files-found: warn
          retention-days: 14
